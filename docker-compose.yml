services:
  # ============================================================================
  # DATABASES
  # ============================================================================
  
  # PostgreSQL - Primary relational database
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres

  # MongoDB - Analytics, logs, AI conversations 
  mongodb:
    extends:
      file: docker-compose.base.yml
      service: mongodb

  # Redis - Cache, sessions, queues 
  redis:
    extends:
      file: docker-compose.base.yml
      service: redis

  # Qdrant - Vector database for AI/RAG
  qdrant:
    extends:
      file: docker-compose.base.yml
      service: qdrant

  # ============================================================================
  # MESSAGE BROKERS
  # ============================================================================

  # Kafka - Event streaming
  kafka:
    extends:
      file: docker-compose.base.yml
      service: kafka

  # ============================================================================
  # SEARCH & ANALYTICS
  # ============================================================================

  # Elasticsearch - Full-text search
  elasticsearch:
    extends:
      file: docker-compose.base.yml
      service: elasticsearch

  # Kibana - Elasticsearch UI
  kibana:
    extends:
      file: docker-compose.base.yml
      service: kibana

  # ============================================================================
  # API GATEWAY & COMMUNICATION LAYER
  # ============================================================================

  # gRPC Service Registry & Load Balancer
  grpc-registry:
    extends:
      file: docker-compose.base.yml
      service: grpc-registry

  # NGINX Reverse Proxy - Main entry point for external traffic
  nginx-proxy:
    extends:
      file: docker-compose.base.yml
      service: nginx-proxy

  # ============================================================================
  # SIMPLE LOGGING
  # ============================================================================
  # Note: Monitoring services (Prometheus, Grafana, Jaeger) have been removed
  # Only keeping Kibana for simple log visualization

  # ============================================================================
  # DEVELOPMENT TOOLS
  # ============================================================================

  # Adminer - Lightweight PostgreSQL management
  adminer:
    extends:
      file: docker-compose.devtools.yml
      service: adminer

  # Mongo Express - MongoDB management
  mongo-express:
    extends:
      file: docker-compose.devtools.yml
      service: mongo-express

  # Redis Commander - Redis management
  redis-commander:
    extends:
      file: docker-compose.devtools.yml
      service: redis-commander

  # Kafka UI - Kafka management
  kafka-ui:
    extends:
      file: docker-compose.devtools.yml
      service: kafka-ui

  # ============================================================================
  # APPLICATION SERVICES (Full Stack Profile)
  # ============================================================================

  # Auth Service (Go) - Authentication and Authorization
  auth-service:
    extends:
      file: docker-compose.services.yml
      service: auth-service

  # Subscription Service (Go) - Subscription and Billing Management
  subscription-service:
    extends:
      file: docker-compose.services.yml
      service: subscription-service

  # API Gateway - Main API Gateway
  api-gateway:
    extends:
      file: docker-compose.services.yml
      service: api-gateway

  # AI Copilot Service - AI-powered ERP assistance with Ollama integration
  ai-copilot:
    extends:
      file: docker-compose.services.yml
      service: ai-copilot

  # Next.js Frontend - Main Web Application
  erp-frontend:
    extends:
      file: docker-compose.services.yml
      service: erp-frontend

  # Log Service
  log-service:
    extends:
      file: docker-compose.services.yml
      service: log-service

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  qdrant_data:
  kafka_data:
  elasticsearch_data:
  elasticsearch_config:
  pgadmin_data:
  consul_data:
  frontend_node_modules:
  frontend_next:

networks:
  erp-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}
